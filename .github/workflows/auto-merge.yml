name: Auto-Merge Copilot Drafts

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  undraft-and-merge:
    runs-on: ubuntu-latest
    # 1. Target the specific "Copilot" bot user seen in your screenshot
    if: |
      github.actor == 'copilot-workspace[bot]' || 
      github.actor == 'github-copilot[bot]'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mark as Ready (Undraft)
        # 2. This command forces the PR out of "Draft" mode
        run: gh pr ready "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Approve and Merge
        # 3. Now that it is ready, approve and merge it
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
